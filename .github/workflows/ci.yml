name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest suite
        run: python -m pytest tests/ -v

      - name: Verify CLI self-compliance and risky example detection
        run: |
          ai-sbom-gate scan . --exclude examples --policy open-source-permissive --fail-on low
          ai-sbom-gate scan examples/compliant_rag_app --policy commercial-closed-source --fail-on low
          ai-sbom-gate licenses --format json > /dev/null || ai-sbom-gate licenses --format json
